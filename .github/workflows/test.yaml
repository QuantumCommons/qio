name: Test package

on: [push]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            requirements: tests/requirements.txt
            pytest-targets: tests/
            pytest-select: '-k "not perceval"'
          - name: perceval
            requirements: tests/requirements-perceval.txt
            pytest-targets: 'tests/src/circuit_conversion/ tests/src/result_conversion/'
            pytest-select: '-k "perceval"'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel scmver setuptools setuptools-scm

    - name: Get version from setup.py
      id: version
      run: |
        version=$(sed -n 's/^ *version.*=.*"\([^"]*\)".*/\1/p' pyproject.toml)
        echo "version=$version" >> $GITHUB_ENV
        echo "Version : $version"

    - name: Build package
      run: python -m build

    - name: Install package
      run: pip install dist/qio-${version}-py3-none-any.whl

    - name: Install test (${{ matrix.name }} battery)
      run: pip install -r ${{ matrix.requirements }}

    - name: Run test (${{ matrix.name }} battery)
      run: pytest -s --showprogress -vv ${{ matrix.pytest-targets }} ${{ matrix.pytest-select }}
