name: Deploy to PyPi

on:
  workflow_run:
    workflows: ["Test package"]
    types:
      - completed
    branches:
      - main
    status:
      - success

jobs:
  publish:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools-scm

    - name: Get version
      id: version
      run: |
        version=$(sed -n 's/^ *version.*=.*"\([^"]*\)".*/\1/p' pyproject.toml)
        echo "version=$version" >> $GITHUB_ENV
        echo "Version : $version"

    - name: Build package
      run: python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@v1.5.0
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Create and push tag
      run: |
        git tag v$version
        git push origin v$version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  loss-report:
    permissions:
      contents: write
      actions: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download loss report observations
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        path: observed/

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install report dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-report.txt

    - name: Regenerate loss report
      run: |
        args=()
        for f in observed/*/loss-report-*.json; do
          [ -f "$f" ] && args+=(--observed "$f")
        done
        python tests/tools/generate_report.py "${args[@]}"

    - name: Commit loss report
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add LOSS_REPORT.md
        if git diff --cached --quiet; then
          echo "LOSS_REPORT.md unchanged"
        else
          git commit -m "chore: regenerate LOSS_REPORT.md from test observations"
          git push origin HEAD:main
        fi