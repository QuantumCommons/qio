[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qio"
version = "0.2.8"
description = "Common quantum computing objects description and conversion library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "dataclasses-json",
    "openqasm3[parser]>=0.4.0",
    "pyqasm>=0.5.0,<1.1.0",
]

[tool.setuptools_scm]

[tool.pytest.ini_options]
markers = [
    "gate: gate-based qubit circuit conversions (cirq/qiskit/cudaq/mimiq/QIR/Aer)",
    "analog: analog pulse-schedule conversions (pulser)",
    "photonic: mode-based photonic circuit/result conversions",
]

[project.urls]
Repository = "https://github.com/QuantumCommons/qio"